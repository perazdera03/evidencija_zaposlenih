<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/bootstrap-5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/fontawesome-free-6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Evidencija zaposlenih</title>
</head>
<body>
    {% if session.get('ulogovani_korisnik') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">Evidencija zaposlenih</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/moj_profil' %}active{% endif %}" href="{{ url_for('moj_profil') }}">Moj profil</a>
                </li>
                {% if trenutna_rola != 'zaposleni' %}
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/zaposleni') and request.path != '/moj_profil' %}active{% endif %}" href="{{ url_for('zaposleni') }}">Zaposleni</a>
                </li>
                {% endif %}
    {% if trenutna_rola == 'administrator' %}
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/projekti') %}active{% endif %}" href="{{ url_for('projekti') }}">Projekti</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/korisnici') %}active{% endif %}" href="{{ url_for('korisnici') }}">Korisnici</a>
                </li>
    {% endif %}
                </ul>
                    <a href="{{ url_for('logout') }}" class="btn btn-primary">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </nav>
    {% endif %}

    {% block content %} {% endblock %}

    <script src="/static/jquery-3.7.1.js"></script>
    <script src="/static/bootstrap-5.3.2/js/bootstrap.min.js"></script>
    <script src="/static/fontawesome-free-6.5.1/js/all.min.js"></script>
</body>
</html>
