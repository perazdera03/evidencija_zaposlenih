{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h3 class="my-4">Novi korisnik</h3>
    <form action="{{ url_for('korisnici_novi') }}" method="POST">
        <h5 class="mt-3">Lični podaci</h5>
        <div class="form-group mb-3">
            <label for="ime">Ime</label>
            <input type="text" class="form-control" id="ime" name="ime" required>
        </div>
        <div class="form-group mb-3">
            <label for="prezime">Prezime</label>
            <input type="text" class="form-control" id="prezime" name="prezime" required>
        </div>
        <div class="form-group mb-3">
            <label for="maticni_broj">Matični broj</label>
            <input type="text" class="form-control" id="maticni_broj" name="maticni_broj" required>
        </div>
        <div class="form-group mb-3">
            <label for="jmbg">JMBG</label>
            <input type="text" class="form-control" id="jmbg" name="jmbg" required>
        </div>
        <div class="form-group mb-3">
            <label for="broj_telefona">Broj telefona</label>
            <input type="text" class="form-control" id="broj_telefona" name="broj_telefona">
        </div>

        <h5 class="mt-4">Podaci za prijavu</h5>
        <div class="form-group mb-3">
            <label for="email">Email (za prijavu)</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group mb-3">
            <label for="lozinka">Lozinka</label>
            <input type="password" class="form-control" id="lozinka" name="lozinka" required>
        </div>
        <div class="form-group mb-3">
            <label for="rola">Rola</label>
            <select id="rola" name="rola" class="form-control">
                <option value="">--Izaberi rolu--</option>
                <option value="administrator">Administrator</option>
                <option value="menadzer">Menadžer</option>
                <option value="zaposleni">Zaposleni</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Sačuvaj</button>
    </form>
</div>
{% endblock %}
